[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etlflow"
version = "1.0.0"
description = "Declarative data pipelines that fail loudly and resume cheaply"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["etl", "pipeline", "data", "orchestration", "csv", "checkpoint", "dry-run"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ardani13ln-byte/etl-flow"
Issues = "https://github.com/ardani13ln-byte/etl-flow/issues"

[tool.setuptools]
packages = ["etlflow"]
